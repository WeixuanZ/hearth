[workspace]
# hap is vendored and patched; its tests run with ours.
members = [".", "vendor/hap"]

[package]
name = "hearth"
version = "1.0.4"
edition = "2021"
description = "Local HomeKit bridge. One process, one connector per device that is not HomeKit."
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
linkme = "0.3"
# Matter, beside HomeKit (surfaces::matter).
rs-matter = { version = "=0.4.1", features = ["async-io", "groups", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3"] }
rand10 = { package = "rand", version = "=0.10.2", features = ["std", "std_rng", "thread_rng"] }
async-io = "2"
futures-lite = "2"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cipher = "0.4"
env_logger = "0.11"
futures-util = "0.3"
hap = { path = "vendor/hap" }
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
mdns-sd = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
# Keys in the order written: Home Connect appliances are sent their messages
# field for field as their own app sends them.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "process", "sync", "time", "signal"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
toml = "0.8"
x25519-dalek = "2"
openssl = { version = "0.10.81", features = ["vendored"] }
tokio-openssl = "0.6.5"
quick-xml = "0.42.0"
zip = "9.1.3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Matter advertises through the system's own mDNS: Bonjour on a Mac, Avahi
# elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
rs-matter = { version = "=0.4.1", features = ["astro-dnssd"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rs-matter = { version = "=0.4.1", features = ["zbus"] }
