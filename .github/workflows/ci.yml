name: CI

# One Linux job per pull request, to keep Actions minutes small: macOS
# runners bill ten times Linux. The Mac side (the Rust build there and the
# menu bar app) is checked by scripts/ci.sh before a push, the app again
# here only when it changes (app.yml), and every target builds at release.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "contrib/**"]
  # After a merge, only to save the build cache pull requests start from.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "contrib/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Builds from main are saved; pull requests start from them, so only
      # what changed compiles.
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check -p hearth

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
