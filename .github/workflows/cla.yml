name: CLA

# Each contributor signs CLA.md once, by commenting on a pull request.
# Signatures are kept on the cla-signatures branch of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Signed
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    steps:
      # Runs the action only: no code from the pull request is checked out.
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Claude* covers the Co-Authored-By trailer on Claude Code commits:
          # it names no GitHub account, so it could never sign.
          allowlist: WeixuanZ,dependabot[bot],github-actions[bot],Claude*
