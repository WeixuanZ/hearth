name: App

# The menu bar app, once, on this runner's own architecture, and only when
# it changes. Both architectures build at release.
on:
  pull_request:
    paths: ["macos/**"]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menu-bar:
    name: Menu bar
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the app
        run: macos/build.sh
