name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - asset: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            app: arm64
          - asset: macos-x86_64
            os: macos-15
            target: x86_64-apple-darwin
            app: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="hearth"))')
          if [ "$tag" != "$crate" ]; then
            echo "Tag v$tag does not match Cargo.toml version $crate."
            exit 1
          fi

      - name: Cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          set -eu
          name="hearth-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          mkdir -p "stage/$name" out
          cp "target/${{ matrix.target }}/release/hearth" LICENSE README.md "stage/$name/"
          tar -C stage -czf "out/${name}.tar.gz" "$name"

      - name: Package the menu bar app
        if: matrix.app
        env:
          ARCH: ${{ matrix.app }}
          HEARTH_BIN: target/${{ matrix.target }}/release/hearth
        run: |
          set -eu
          HEARTH_BIN="$PWD/$HEARTH_BIN" macos/build.sh
          ditto -c -k --keepParent macos/Hearth.app "out/Hearth-${GITHUB_REF_NAME}-${{ matrix.asset }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
